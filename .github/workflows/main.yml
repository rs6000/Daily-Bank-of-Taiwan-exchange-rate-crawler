name: Daily Exchange Rate Crawler (BOT - TPE Time)

on:
    # 每日排程觸發：
    # 這裡設置為每天 UTC 時間 01:00 執行。
    # 換算成台北時間 (GMT+8) 約為 上午 9 點
    schedule:
        - cron: "0 1 * * *"

    # 允許您隨時手動點擊按鈕來運行工作流 (方便測試)
    workflow_dispatch:

jobs:
    update-rates:
        runs-on: ubuntu-latest

        # *** 關鍵修正：授予 Action 寫入 (write) 權限，以解決 Permission denied 錯誤 ***
        permissions:
            contents: write

        steps:
            # 1. 檢查程式碼
            - name: Checkout repository code
              uses: actions/checkout@v4

            # 2. 設定 Python 環境
            # 修正點：將 "3.x" 改為固定的穩定版本 "3.10"，避免被 GitHub 自動升級到未知的最新版導致環境衝突
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            # 3. 安裝爬蟲所需的依賴 (包含 lxml, pytz, beautifulsoup4, requests)
            # 修正點：補上了 beautifulsoup4 和 requests 確保爬蟲正常運作
            - name: Install dependencies (pandas, html5lib, pytz, lxml, beautifulsoup4, requests)
              run: |
                  python -m pip install --upgrade pip
                  pip install pandas html5lib pytz lxml beautifulsoup4 requests

            # 4. 執行爬蟲程式 (產生 history.json 和 app.log)
            - name: Run Crawler and Generate History Data and Log
              # 確保這裡的檔案名稱與您實際使用的 Python 檔案名稱一致
              run: python Exhange-Rates-Gemini.py

            # 5. 自動提交和推送變更
            - name: Commit and Push new data and log files
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  # *** 最終修正：使用 'data/*' 提交 history.json ***
                  file_pattern: "data/*"

                  # 修正提交訊息
                  commit_message: "🤖 Daily BOT History Update & Log: ${{ github.event.repository.name }}"

                  # 設置提交者的名稱和郵件地址
                  commit_user_name: "GitHub Action Bot"
                  commit_user_email: "action@github.com"
